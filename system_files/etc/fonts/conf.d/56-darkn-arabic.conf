<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Darkn OS: one consistent set of Arabic fonts everywhere</description>

  <!--
    Arabic text asked for with a generic family always gets the same font,
    instead of whichever Arabic-capable font happens to be found first.
    The rules only apply to Arabic runs, so Latin text is untouched.
  -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>

  <!--
    Documents written on Windows name Microsoft's Arabic fonts, which cannot
    be shipped here. Map each one to the closest open font so the document
    keeps its character instead of falling back to something arbitrary.
  -->
  <alias binding="same">
    <family>Traditional Arabic</family>
    <accept><family>Amiri</family></accept>
  </alias>
  <alias binding="same">
    <family>Arabic Typesetting</family>
    <accept><family>Amiri</family></accept>
  </alias>
  <alias binding="same">
    <family>Simplified Arabic</family>
    <accept><family>Noto Naskh Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Simplified Arabic Fixed</family>
    <accept><family>Noto Naskh Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Arabic Transparent</family>
    <accept><family>Noto Naskh Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Sakkal Majalla</family>
    <accept><family>Noto Naskh Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Andalus</family>
    <accept><family>Aref Ruqaa</family></accept>
  </alias>
  <alias binding="same">
    <family>Dubai</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI Arabic</family>
    <accept><family>Noto Sans Arabic</family></accept>
  </alias>
</fontconfig>
