# Darkn OS: encrypted DNS through Quad9 (blocks known malicious domains,
# keeps no personal logs).
#
# "opportunistic" encrypts whenever the network allows it and falls back to
# plain DNS when port 853 is blocked, so a restrictive network can never
# leave the machine without name resolution. Change it to "yes" to refuse
# unencrypted DNS entirely.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
Domains=~.
